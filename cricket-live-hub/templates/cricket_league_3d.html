<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cricket League 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --accent: #10b981; --accent-d: #059669; --live: #ef4444;
    --hud: rgba(15, 23, 42, .82); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; color: var(--ink);
    font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; }
  canvas { display: block; }
  button { font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 6px; font: 700 11px Inter, sans-serif;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); border-bottom-width: 2px; text-align: center; color: #fff; }

  /* ---------- menus ---------- */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20;
    background: rgba(2, 6, 23, .42); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .card { width: min(540px, 100%); max-height: 100%; overflow: auto; background: #fff; border-radius: 22px; padding: 26px 28px;
    box-shadow: 0 30px 80px rgba(2, 6, 23, .35); }
  .logo { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; font-size: 28px;
    background: linear-gradient(135deg, #064e3b, #10b981); }
  h1 { margin: 12px 0 2px; font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
  h1 span { color: var(--accent); }
  .muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
  .stack { display: grid; gap: 10px; margin: 22px 0 8px; }
  .big { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--line);
    background: #f8fafc; font-size: 16px; font-weight: 700; color: var(--ink); text-align: left; transition: all .15s; }
  .big:hover { border-color: var(--accent); background: #ecfdf5; transform: translateY(-1px); }
  .big .ic { font-size: 26px; } .big small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .back { width: 38px; height: 38px; flex: none; border-radius: 11px; border: 1px solid var(--line); background: #fff; font-size: 18px; color: var(--ink); }
  .back:hover { border-color: var(--ink); }
  .label { font-size: 11.5px; font-weight: 800; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .1em; }
  .teams { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: 12px;
    border: 2px solid transparent; background: #f8fafc; font-size: 11px; font-weight: 800; color: var(--muted); transition: all .12s; }
  .team:hover { background: #f1f5f9; }
  .team.on { border-color: var(--accent); background: #ecfdf5; color: var(--ink); }
  .team.taken { opacity: .28; cursor: not-allowed; }
  .badge { display: inline-grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 50%; font-size: 10.5px;
    font-weight: 900; letter-spacing: .02em; }
  .badge.lg { width: 66px; height: 66px; font-size: 16px; } .badge.sm { width: 30px; height: 30px; font-size: 9px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 700; font-size: 14px; color: var(--ink); }
  .chip:hover { border-color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chips input { width: 64px; padding: 8px 6px; border-radius: 999px; border: 1px solid var(--line); font: 700 14px Inter, sans-serif;
    text-align: center; outline: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .primary { width: 100%; margin-top: 22px; padding: 15px; border: 0; border-radius: 14px; background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 800; box-shadow: 0 10px 24px rgba(16, 185, 129, .28); transition: background .15s; }
  .primary:hover { background: var(--accent-d); }
  .primary:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }
  .ghost { width: 100%; margin-top: 10px; padding: 13px; border-radius: 14px; border: 1px solid var(--line); background: #fff;
    font-size: 15px; font-weight: 700; color: var(--ink); }
  .ghost:hover { border-color: var(--ink); }
  .field { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); font: 500 15px Inter, sans-serif;
    margin-top: 10px; outline: none; color: var(--ink); }
  .field:focus { border-color: var(--accent); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #f1f5f9; border-radius: 12px; padding: 4px; margin: 18px 0 6px; }
  .tabs button { border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 700; color: var(--muted); }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .formmsg { margin-top: 12px; font-size: 14px; color: #dc2626; min-height: 18px; line-height: 1.5; }
  .formmsg.ok { color: var(--accent-d); }
  .me { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #f8fafc; margin-top: 16px; }
  .me .grow { flex: 1; }
  .link { border: 0; background: none; color: var(--muted); font-weight: 600; text-decoration: underline; font-size: 13px; padding: 4px; }
  .link:hover { color: var(--ink); }
  .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin: 18px 0 10px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .join { display: flex; gap: 8px; }
  .join .field { margin: 0; text-transform: uppercase; letter-spacing: .3em; font-weight: 800; text-align: center; }
  .secondary { padding: 0 22px; border-radius: 12px; border: 0; background: var(--ink); color: #fff; font-weight: 700; font-size: 15px; }
  .code-box { text-align: center; padding: 16px; border-radius: 16px; background: #f8fafc; margin-top: 16px; }
  .code { font-size: 42px; font-weight: 900; letter-spacing: .25em; margin: 2px 0 0 .25em; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 14px; }
  .side { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-height: 128px;
    justify-content: center; border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; }
  .side small { color: var(--muted); font-size: 12px; }
  .side .wait { color: var(--muted); font-size: 13px; }
  .vs-mid { font-weight: 900; color: var(--muted); }
  .msg-title { font-size: 26px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 6px; }
  .msg-body { font-size: 15px; line-height: 1.6; color: #334155; }
  .scorecard { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .scorecard .r { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .scorecard .r:last-child { border: 0; }
  .scorecard .grow { flex: 1; } .scorecard small { color: var(--muted); }

  /* ---------- in-game HUD ---------- */
  #sb { position: fixed; top: 14px; left: 14px; padding: 10px 14px 12px; border-radius: 16px; background: var(--hud); color: #fff;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); min-width: 230px; }
  .sb-row { display: flex; align-items: center; gap: 10px; }
  #sbScore { font-size: 28px; font-weight: 900; letter-spacing: -.02em; }
  #sbOvers { opacity: .7; font-weight: 600; font-size: 14px; }
  .sb-sub { font-size: 12.5px; opacity: .85; margin-top: 4px; }
  .sb-sub b { color: #fbbf24; }
  .sb-over { display: flex; gap: 4px; margin-top: 8px; min-height: 22px; }
  .sb-over .b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 800;
    background: rgba(255,255,255,.14); }
  .sb-over .b4 { background: #2563eb; } .sb-over .b6 { background: #9333ea; } .sb-over .bW { background: var(--live); }
  .sb-over .bWd { background: #475569; font-size: 8.5px; }
  #topR { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; align-items: center; }
  #speed { padding: 10px 14px; border-radius: 12px; background: var(--hud); color: #fff; font-weight: 800; font-size: 14px; }
  #speed:empty { display: none; }
  #speed span { opacity: .65; font-weight: 600; margin-left: 6px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--hud); color: #fff; font-size: 18px; }
  .icon-btn:hover { background: rgba(15,23,42,.95); }
  #status { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); padding: 11px 18px; border-radius: 999px;
    background: var(--hud); color: #fff; font-size: 14px; white-space: nowrap; display: flex; gap: 12px; align-items: center;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #status .keys { opacity: .8; font-size: 12.5px; }
  #flash { position: fixed; top: 36%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; color: #fff; }
  #flash .ft { font-size: 92px; font-weight: 900; letter-spacing: -.04em; line-height: 1; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  #flash .fs { margin-top: 8px; font-size: 18px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
  #flash.show { animation: pop 1.6s ease forwards; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    24% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
  #timing { position: fixed; top: 54%; left: 50%; transform: translateX(-50%); font-weight: 900; font-size: 20px; letter-spacing: .14em;
    opacity: 0; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #timing.show { animation: fade 1s ease forwards; }
  @keyframes fade { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
  #toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px;
    background: rgba(16,185,129,.95); color: #fff; font-weight: 700; font-size: 13px; opacity: 0; pointer-events: none; }
  #toast.show { animation: fade 2.2s ease forwards; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } #flash .ft { font-size: 60px; } }
</style>
</head>
<body>

<!-- ======================= HUD ======================= -->
<div id="hud" class="hidden">
  <div id="sb">
    <div class="sb-row"><span id="sbTeam"></span><span id="sbScore">0/0</span><span id="sbOvers"></span></div>
    <div id="sbSub" class="sb-sub"></div>
    <div id="sbOver" class="sb-over"></div>
  </div>
  <div id="topR"><div id="speed"></div><button id="menuBtn" class="icon-btn" title="Menu">☰</button></div>
  <div id="status" class="hidden"></div>
  <div id="flash"></div>
  <div id="timing"></div>
  <div id="toast"></div>
</div>

<!-- ======================= MENUS ======================= -->
<div id="screens" class="overlay">
  <div class="card" id="scrHome">
    <div class="logo">🏏</div>
    <h1>Cricket League <span>3D</span></h1>
    <div class="muted">Pick your IPL side and play.</div>
    <div class="stack">
      <button class="big" data-go="cpu"><span class="ic">🤖</span><span>Play vs CPU<small>Quick match against the computer</small></span></button>
      <button class="big" data-go="online"><span class="ic">🌐</span><span>Play online<small>Sign in and play a friend on another computer</small></span></button>
    </div>
    <div id="homeUser" class="muted small center"></div>
  </div>

  <div class="card hidden" id="scrSetup">
    <div class="head"><button class="back" data-back="scrHome">←</button><h2>Play vs CPU</h2></div>
    <div class="label">Your team</div>
    <div class="teams" id="pick1"></div>
    <div class="grid2">
      <div><div class="label">Overs</div><div class="chips" id="oversChips"></div></div>
      <div><div class="label">Wickets</div><div class="chips" id="wktChips"></div></div>
    </div>
    <div class="label">Difficulty</div><div class="chips" id="diffChips"></div>
    <button class="primary" id="setupStart">Start match</button>
  </div>

  <div class="card hidden" id="scrAuth">
    <div class="head"><button class="back" data-back="scrHome">←</button><h2>Play online</h2></div>
    <div class="tabs" id="authTabs"><button data-tab="in" class="on">Sign in</button><button data-tab="up">Create account</button></div>
    <input class="field" id="auUser" placeholder="Username" maxlength="16" autocomplete="username">
    <input class="field" id="auPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="primary" id="auGo">Sign in</button>
    <div class="formmsg" id="auMsg"></div>
    <div class="label">Game server</div>
    <input class="field" id="auServer" placeholder="http://192.168.1.20:8765" autocomplete="off" style="margin-top:0">
    <div class="muted small" style="margin-top:6px">Both players must use the same server address.</div>
  </div>

  <div class="card hidden" id="scrLobby">
    <div class="head"><button class="back" data-back="scrHome">←</button><h2>Online</h2></div>
    <div class="me"><span id="lbBadge"></span><div class="grow"><b id="lbName"></b><div class="muted small" id="lbRecord"></div></div>
      <button class="link" id="signOut">Sign out</button></div>
    <div class="label">Your team</div>
    <div class="teams" id="pickOnline"></div>
    <div class="grid2">
      <div><div class="label">Overs</div><div class="chips" id="oversChipsOnline"></div></div>
      <div><div class="label">Wickets</div><div class="chips" id="wktChipsOnline"></div></div>
    </div>
    <button class="primary" id="createRoom">Create a room</button>
    <div class="or">or join a friend's room</div>
    <div class="join"><input class="field" id="joinCode" placeholder="CODE" maxlength="5" autocomplete="off"><button class="secondary" id="joinBtn">Join</button></div>
    <div class="formmsg" id="lbMsg"></div>
  </div>

  <div class="card hidden" id="scrRoom">
    <div class="head"><button class="back" id="roomLeave">←</button><h2>Match room</h2></div>
    <div class="code-box"><div class="muted small">Share this code with your friend</div><div class="code" id="roomCode"></div>
      <button class="link" id="copyCode">Copy code</button></div>
    <div class="vs"><div class="side" id="roomHost"></div><div class="vs-mid">VS</div><div class="side" id="roomGuest"></div></div>
    <div class="label">Your team</div>
    <div class="teams" id="pickRoom"></div>
    <div class="muted small center" id="roomInfo" style="margin-top:14px"></div>
    <button class="primary" id="roomStart" disabled>Start match</button>
    <div class="formmsg center" id="roomMsg"></div>
  </div>
</div>

<div id="msg" class="overlay hidden">
  <div class="card">
    <div id="msgTitle" class="msg-title"></div>
    <div id="msgBody" class="msg-body"></div>
    <div id="msgBtns"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);

  // Filled in by the Cricket Live Hub app with the address of its game server (game_server.py).
  const SERVER_DEFAULT = "__GAME_SERVER__";

  if (!window.THREE) {
    $("scrHome").innerHTML = '<div class="msg-title">Couldn’t load the 3D engine</div>' +
      '<p class="msg-body">This game needs an internet connection to load. Check your connection and reload.</p>';
    return;
  }

  // ================================================================ utils
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - (1 - t) * (1 - t);
  const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const M = (c) => new THREE.MeshLambertMaterial({ color: c });
  const hex = (n) => "#" + n.toString(16).padStart(6, "0");
  const darken = (n, f) => (Math.round(((n >> 16) & 255) * f) << 16) | (Math.round(((n >> 8) & 255) * f) << 8) | Math.round((n & 255) * f);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: (k, v) => { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  };

  const G = 9.8, ZH = -1.2, BAT_Z = -0.95, BOWL_STUMPS = -20.12, BOUNDARY = 65, RUNUP = 1.1;
  const CENTER = V(0, 0, -10);

  const IPL = {
    CSK: { name: "Chennai Super Kings", c1: 0xf9cd05, c2: 0x1b4fa0, fg: "#111" },
    MI: { name: "Mumbai Indians", c1: 0x004ba0, c2: 0xd1ab3e, fg: "#fff" },
    RCB: { name: "Royal Challengers Bengaluru", c1: 0xd11d1d, c2: 0x1a1a1a, fg: "#fff" },
    KKR: { name: "Kolkata Knight Riders", c1: 0x3a225d, c2: 0xd4af37, fg: "#fff" },
    DC: { name: "Delhi Capitals", c1: 0x17449b, c2: 0xef1b23, fg: "#fff" },
    PBKS: { name: "Punjab Kings", c1: 0xdd1f2d, c2: 0xd9dde2, fg: "#fff" },
    RR: { name: "Rajasthan Royals", c1: 0xea1a85, c2: 0x254aa5, fg: "#fff" },
    SRH: { name: "Sunrisers Hyderabad", c1: 0xf26522, c2: 0x111111, fg: "#fff" },
    GT: { name: "Gujarat Titans", c1: 0x1b2133, c2: 0xdbbe6e, fg: "#fff" },
    LSG: { name: "Lucknow Super Giants", c1: 0x0057e2, c2: 0xf28b00, fg: "#fff" },
  };
  const TEAM_KEYS = Object.keys(IPL);
  function badgeHTML(k, size) {
    const t = IPL[k] || IPL.MI;
    return `<span class="badge${size ? " " + size : ""}" style="background:${hex(t.c1)};color:${t.fg};` +
      `box-shadow:inset 0 -4px 0 ${hex(t.c2)}">${k}</span>`;
  }

  // ================================================================ renderer + scene
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 700);
  camera.position.set(60, 30, 40);

  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  scene.background = canvasTex(2, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, "#1e4f91"); gr.addColorStop(0.55, "#7fb6e6"); gr.addColorStop(1, "#d6ebfa");
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
  scene.fog = new THREE.Fog(0xbcd9f2, 160, 420);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x3b6b35, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(25, 55, -30); sun.target.position.set(0, 0, -8);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
  Object.assign(sun.shadow.camera, { left: -38, right: 38, top: 38, bottom: -38, near: 1, far: 160 });
  sun.shadow.camera.updateProjectionMatrix();
  scene.add(sun, sun.target);

  // ---------------- stadium
  const grassTex = canvasTex(256, 256, (g, w, h) => {
    for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#3d8b37" : "#48983f"; g.fillRect(i * w / 8, 0, w / 8, h); }
    for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.07})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  });
  grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(5, 5);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(92, 96), new THREE.MeshLambertMaterial({ map: grassTex }));
  ground.rotation.x = -Math.PI / 2; ground.position.copy(CENTER); ground.receiveShadow = true; scene.add(ground);
  const rope = new THREE.Mesh(new THREE.TorusGeometry(BOUNDARY, 0.18, 8, 160), M(0xffffff));
  rope.rotation.x = Math.PI / 2; rope.position.set(CENTER.x, 0.15, CENTER.z); scene.add(rope);
  const adTex = canvasTex(2048, 64, (g, w, h) => {

    el.innerHTML = TEAM_KEYS.map((k) => `<button class="team${k === sel ? " on" : ""}${k === taken ? " taken" : ""}" data-k="${k}" ` +
      `title="${IPL[k].name}">${badgeHTML(k)}<span>${k}</span></button>`).join("");
    el.onclick = (e) => { const b = e.target.closest("button"); if (b && b.dataset.k !== taken) onPick(b.dataset.k); };
  }
  function renderChips(el, vals, sel, onPick, fmt, custom) {
    el.innerHTML = vals.map((v) => `<button class="chip${v === sel ? " on" : ""}" data-v="${v}">${fmt ? fmt(v) : v}</button>`).join("") +

    el.onclick = (e) => { const b = e.target.closest("button"); if (b) onPick(isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v); };

  }

  function updateHUD() {
    const inn = S.inn; if (!inn) return;
    const bt = S.teams[inn.bat], st = inn.batters[inn.striker];
    $("sbTeam").innerHTML = badgeHTML(bt.key, "sm");
    $("sbScore").textContent = `${inn.runs}/${inn.wkts}`;
    $("sbOvers").textContent = `${oversStr(inn.balls)} / ${S.cfg.overs} ov`;
    let sub;
    if (S.target) {
      const need = S.target - inn.runs, left = S.cfg.overs * 6 - inn.balls;
      sub = need > 0 ? `Need <b>${need}</b> off <b>${left}</b>` : "Target reached";
    } else sub = esc(bt.name);
    if (st) sub += ` · ${esc(st.name)} ${st.runs} (${st.balls})`;
    $("sbSub").innerHTML = sub;
    $("sbOver").innerHTML = S.thisOver.map((b) => `<span class="b b${b}">${b === 0 ? "•" : b}</span>`).join("");
    updateStatus();
  }
  const lengthName = (L) => L < 2.8 ? "Yorker" : L < 4.3 ? "Full" : L < 7.2 ? "Good length" : "Short";
  const lineName = (x) => { const a = Math.abs(x); if (a < 0.2) return "On the stumps"; if (a > 1.0) return "Wide line"; return x > 0 ? "Leg side" : "Off side"; };
  function updateStatus() {
    let h = "";
    const ph = S.phase, live = ph === "aim" || ph === "runup" || ph === "delivery";
    if (S.inn && live) {
      if (ph === "aim" && bowlKind() === "human") {
        h = `<b>${S.aim.type === "fast" ? "⚡ Fast" : "🌀 Spin"} · ${lengthName(S.aim.L)} · ${lineName(S.aim.x)}</b>` +
          `<span class="keys"><kbd>A</kbd><kbd>D</kbd> line <kbd>W</kbd><kbd>S</kbd> length <kbd>Q</kbd> type <kbd>F</kbd> bowl</span>`;
      } else if (ph === "aim" && bowlKind() === "remote") {
        h = `Waiting for <b>${esc(S.teams[S.inn.bowl].name)}</b> to bowl…`;
      } else if (batKind() === "human") {
        h = `<span class="keys"><kbd>Space</kbd> swing · hold <kbd>←</kbd><kbd>→</kbd> aim · hold <kbd>↑</kbd> loft · hold <kbd>↓</kbd> defend</span>`;
      } else if (batKind() === "remote" && ph !== "aim") {
        h = `<b>${esc(S.teams[S.inn.bat].name)}</b> is batting…`;
      }

    $("status").innerHTML = h; $("status").classList.toggle("hidden", !h);
  }

  // ================================================================ match flow
  function newInnings(bat, bowl) {
    const n = S.cfg.wkts + 1;
    return { bat, bowl, runs: 0, wkts: 0, balls: 0, extras: 0, fours: 0, sixes: 0, striker: 0, non: 1, next: 2,
      batters: Array.from({ length: n }, (_, i) => ({ name: `Batter ${i + 1}`, runs: 0, balls: 0, out: null })) };
  }
  function applyColors() {
    const set = (p, key, helmet) => {
      const t = IPL[key], u = p.userData;
      u.shirtM.color.setHex(t.c1); u.trouserM.color.setHex(darken(t.c1, 0.62)); u.accentM.color.setHex(t.c2);
      u.capM.color.setHex(helmet ? darken(t.c1, 0.6) : t.c1);
    };
    const bk = S.teams[S.inn.bat].key, fk = S.teams[S.inn.bowl].key;
    set(batsman, bk, true); set(nonStriker, bk, true);
    fieldTeam.forEach((p) => set(p, fk, p === keeper));
  }
  function resetMatchState() {
    S.token++; S.target = null; S.cur = 0; S.inn = null; S.innings = []; S.pendingBowl = null; S.netResult = null;
    S.phase = "paused"; screen(null); hideMsg(); $("hud").classList.add("hidden");
  }
  function startOffline() {
    const s = S.setup, cpuTeam = pick(TEAM_KEYS.filter((k) => k !== s.team));
    S.mode = "cpu"; S.cfg = { overs: s.overs, wkts: s.wkts, diff: s.diff };
    S.teams = [{ key: s.team, name: IPL[s.team].name, kind: "human" }, { key: cpuTeam, name: IPL[cpuTeam].name, kind: "cpu" }];
    resetMatchState();
    const w = Math.random() < 0.5 ? 0 : 1, tw = S.teams[w];
    const begin = (batFirst) => { S.innings = [newInnings(batFirst, 1 - batFirst), null]; startInnings(); };
    if (tw.kind === "human") {
      showMsg("🪙 Toss", `<p>${badgeHTML(tw.key, "sm")} <b>${esc(tw.name)}</b> won the toss.</p>`,
        [{ label: "🏏 Bat first", fn: () => begin(w) }, { label: "🎯 Bowl first", fn: () => begin(1 - w) }]);
    } else {
      const batFirst = Math.random() < 0.5;
      showMsg("🪙 Toss", `<p>${badgeHTML(tw.key, "sm")} <b>${esc(tw.name)}</b> won the toss and chose to <b>${batFirst ? "bat" : "bowl"}</b>.</p>`,
        [{ label: "Start match", fn: () => begin(batFirst ? w : 1 - w) }]);
    }
  }
  function startInnings() {
    S.inn = S.innings[S.cur]; S.thisOver = []; S.overDone = false;
    applyColors(); screen(null); $("hud").classList.remove("hidden"); $("speed").innerHTML = "";
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

  }
  function endInnings() {
    if (S.phase === "menu") return;
    S.phase = "paused"; aimMarker.visible = false; updateStatus();
    const inn = S.inn, tok = S.token;
    if (S.cur === 0) {
      S.target = inn.runs + 1;
      S.innings[1] = newInnings(inn.bowl, inn.bat);
      const html = `<p>${badgeHTML(S.teams[inn.bat].key, "sm")} <b>${esc(S.teams[inn.bat].name)}</b> scored <b>${inn.runs}/${inn.wkts}</b> ` +
        `in ${oversStr(inn.balls)} overs.</p><p>${badgeHTML(S.teams[inn.bowl].key, "sm")} <b>${esc(S.teams[inn.bowl].name)}</b> need ` +
        `<b>${S.target}</b> to win from <b>${S.cfg.overs * 6}</b> balls.</p>`;
      const go = () => { if (tok !== S.token) return; S.cur = 1; startInnings(); };

  }
  function showResult() {
    const [a, b] = S.innings;

    if (b.runs >= S.target) { const w = S.cfg.wkts - b.wkts; winner = b.bat; title = `🏆 ${esc(S.teams[b.bat].name)} won by ${w} wicket${w === 1 ? "" : "s"}`; }
    else if (b.runs === S.target - 1) title = "🤝 Match tied!";
    else { const r = S.target - 1 - b.runs; winner = a.bat; title = `🏆 ${esc(S.teams[a.bat].name)} won by ${r} run${r === 1 ? "" : "s"}`; }
    const row = (inn) => {
      const top = inn.batters.slice().sort((x, y) => y.runs - x.runs)[0];
      return `<div class="r">${badgeHTML(S.teams[inn.bat].key, "sm")}<div class="grow"><b>${esc(S.teams[inn.bat].name)}</b><br>` +
        `<small>Top score: ${top.name} ${top.runs} (${top.balls}) · ${inn.fours}×4 ${inn.sixes}×6</small></div>` +

    };
    $("hud").classList.add("hidden");
    const card = `<div class="scorecard">${row(a)}${row(b)}</div>`;
    if (S.mode === "online") {
      recordResult(winner);
      if (S.net) S.net.inMatch = false;
      const host = S.net && S.net.isHost;
      showMsg(title, card + (host ? "" : `<p class="muted small center">The host can start a rematch.</p>`),
        host ? [{ label: "🔁 Rematch", fn: () => { if (S.net && S.net.peer) hostStart(); else showMsg("Opponent left", "", [{ label: "Back to lobby", fn: leaveRoom }]); } },
          { label: "Leave room", fn: leaveRoom }]
          : [{ label: "Leave room", fn: leaveRoom }]);
    } else {
      showMsg(title, card, [{ label: "🔁 Rematch", fn: startOffline }, { label: "Main menu", fn: toMenu }]);
    }
  }
  function toMenu() {
    S.token++; S.phase = "menu"; S.inn = null; S.mode = null; resetField();
    $("hud").classList.add("hidden"); hideMsg(); renderHome(); screen("scrHome");
  }

  function resetField() {
    S.del = null; S.swung = false; S.swingStart = null; S.pendingHit = null; S.crossed = false; S.bounced = false; S.frozen = false;
    S.cpuSwing = null; S.hit = null; S.result = null; S.stumpFx = null; S.chaser = null; S.runners = null; S.celebrate = null; S.netResult = null;
    ball.visible = false; pitchMarker.visible = false; aimMarker.visible = false;
    batsman.position.set(0.5, 0, BAT_Z); batsman.rotation.y = Math.PI / 2;
    nonStriker.position.set(-0.9, 0, -19.4); nonStriker.rotation.y = Math.PI; stand(nonStriker);
    bowler.position.set(-0.35, 0, -26.5); bowler.rotation.y = Math.PI; stand(bowler);
    keeper.position.copy(keeper.userData.home); keeper.rotation.y = 0;
    fielders.forEach((f) => { f.position.copy(f.userData.home); face(f, 0, ZH); stand(f); });
    stumps.parts.forEach((p) => p.rotation.set(0, 0, 0));
    stumps.bails.forEach((b) => { b.position.copy(b.userData.home); b.rotation.set(0, 0, 0); });
  }
  function nextBall() {
    resetField(); S.phase = "aim";
    if (bowlKind() === "human") aimMarker.visible = true;
    else if (bowlKind() === "cpu") S.cpuBowlAt = NOW + 1.1;
    else if (bowlKind() === "remote" && S.pendingBowl) { const s = S.pendingBowl; S.pendingBowl = null; startDelivery(s); }
    updateHUD();
  }

  // ================================================================ deliveries
  function resolveSpec(spec, mul) {
    const fast = spec.type === "fast";
    return { type: spec.type, aimX: clamp(spec.aimX, -1.4, 1.4), L: clamp(spec.L, 1.6, 10.5),
      speed: (fast ? rand(25.5, 29.5) : rand(16.5, 19)) * mul,
      turn: fast ? rand(-0.025, 0.025) : (Math.random() < 0.5 ? -1 : 1) * rand(0.05, 0.1) };
  }
  function makeDelivery(s) {
    const fast = s.type === "fast", R = V(-0.5, 1.75, -19.4), B = V(s.aimX, 0.04, -s.L);
    const t1 = Math.hypot(B.x - R.x, B.z - R.z) / s.speed, v0y = (B.y - R.y + 0.5 * G * t1 * t1) / t1;
    const vz2 = s.speed * 0.86, vx2 = s.turn * vz2, tH = (ZH - B.z) / vz2;
    const hT = clamp(0.22 + (s.L - 1.6) * 0.13, 0.2, 1.5), vy2 = Math.min(5.5, (hT - 0.04 + 0.5 * G * tH * tH) / tH);
    const xH = B.x + vx2 * tH;
    return { type: s.type, L: s.L, R, B, t1, v0y, vz2, vx2, vy2, tH, T: t1 + tH, xH, wide: Math.abs(xH) > 1.1,
      kmh: Math.round(s.speed * (fast ? 4.9 : 4.6)) };
  }
  function ballPos(d, t, out) {
    if (t <= d.t1) { const s = t / d.t1; out.set(lerp(d.R.x, d.B.x, s), d.R.y + d.v0y * t - 0.5 * G * t * t, lerp(d.R.z, d.B.z, s)); }
    else { const u = t - d.t1; out.set(d.B.x + d.vx2 * u, Math.max(0.04, 0.04 + d.vy2 * u - 0.5 * G * u * u), d.B.z + d.vz2 * u); }
  }
  function cpuSpec() {
    const diff = S.cfg.diff, r = Math.random();
    let L;
    if (r < (diff === "hard" ? 0.25 : 0.12)) L = rand(1.7, 2.6);
    else if (r < 0.7) L = rand(4.4, 6.8);
    else if (r < 0.88) L = rand(7.5, 9.8);
    else L = rand(3, 4.3);
    const sd = diff === "easy" ? 0.45 : diff === "hard" ? 0.25 : 0.35;
    return resolveSpec({ type: Math.random() < 0.62 ? "fast" : "spin", aimX: clamp(0.05 + gauss() * sd, -1.25, 1.25), L },
      { easy: 0.88, medium: 1, hard: 1.08 }[diff]);
  }
  function startDelivery(spec) {
    if (S.overDone) { S.thisOver = []; S.overDone = false; }
    S.del = makeDelivery(spec); S.phase = "runup"; S.runupStart = NOW;
    aimMarker.visible = false;
    pitchMarker.position.set(S.del.B.x, 0.026, S.del.B.z); pitchMarker.visible = true;
    updateHUD();
  }
  function bowlHuman() {
    const spec = resolveSpec({ type: S.aim.type, aimX: S.aim.x + gauss() * 0.06, L: S.aim.L + gauss() * 0.2 }, 1);
    if (S.mode === "online") send({ t: "bowl", s: spec });
    startDelivery(spec);
  }
  function release() {
    S.phase = "delivery"; S.releaseAt = NOW; ball.visible = true;
    $("speed").innerHTML = `${S.del.kmh} km/h<span>${S.del.type === "fast" ? "Pace" : "Spin"}</span>`;
    if (batKind() === "cpu") scheduleCpuSwing();
  }
  function scheduleCpuSwing() {
    const d = S.del, inn = S.inn;
    let sd = { easy: 0.085, medium: 0.06, hard: 0.042 }[S.cfg.diff];
    if (d.L < 2.8) sd *= 1.5;
    if (d.type === "spin") sd *= 0.85;
    if (Math.abs(d.xH) > 0.95 && Math.random() < 0.6) return; // leaves it
    const ballsLeft = S.cfg.overs * 6 - inn.balls;
    let loftP = 0.22;
    if (S.target) loftP += clamp(((S.target - inn.runs) / Math.max(1, ballsLeft) * 6 - 7) * 0.05, 0, 0.4);
    if (ballsLeft <= 6) loftP += 0.2;
    S.cpuSwing = { at: S.releaseAt + d.T + gauss() * sd - 0.01, dir: pick([-1, 0, 0, 1]), loft: Math.random() < loftP };
  }

  // ================================================================ batting + results
  function trySwing(dir, loft, defend) {
    if (S.swung || !(S.phase === "runup" || S.phase === "delivery")) return;
    S.swung = true; S.swingStart = NOW;
    const d = S.del, t = S.phase === "delivery" ? NOW - S.releaseAt : -1, err = t - d.T;
    let m = 1;
    if (d.L < 2.8) m *= 0.7; else if (d.L > 8.5) m *= 0.85;
    if (d.type === "spin") m *= 1.15;
    const early = err < 0, a = Math.abs(err), W = early ? [0.06, 0.12, 0.2] : [0.035, 0.065, 0.1];
    let q = null;
    if (Math.abs(d.xH) <= 1.15) { if (a <= W[0] * m) q = "perfect"; else if (a <= W[1] * m) q = "good"; else if (a <= W[2] * m) q = "edge"; }
    if (batKind() === "human") {
      if (t < 0) showTiming("TOO EARLY", "#f87171");
      else showTiming(q === "perfect" ? "PERFECT" : q === "good" ? "GOOD" : early ? "EARLY" : "LATE",
        q === "perfect" ? "#34d399" : q === "good" ? "#a3e635" : "#fbbf24");
    }
    if (q) S.pendingHit = { q, err, dir, loft, defend, at: Math.max(t, d.T) };
  }
  function humanSwing() { if (batKind() === "human") trySwing((keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0), !!keys.ArrowUp, !!keys.ArrowDown); }

  function computeOutcome(h) {
    const { q, err, dir, loft, defend } = h, r = Math.random();
    let runs = 0, out = null, aerial = false;
    const edge = q === "edge" && !defend;
    if (defend) { if (q === "edge" && r < 0.08) out = "caught"; else runs = r < 0.3 ? 1 : 0; }
    else if (q === "perfect") { if (loft) { runs = r < 0.88 ? 6 : 4; aerial = runs === 6; } else runs = r < 0.7 ? 4 : r < 0.85 ? 3 : 2; }
    else if (q === "good") { if (loft) { if (r < 0.18) out = "caught"; else runs = pick([6, 4, 4, 2, 1]); aerial = runs !== 4; } else runs = pick([1, 1, 2, 2, 3, 4]); }
    else { if (loft) { if (r < 0.42) out = "caught"; else runs = pick([0, 1, 2]); aerial = true; } else if (r < 0.14) out = "caught"; else runs = pick([0, 0, 1, 1, 2, 4]); }
    let a;
    if (edge) a = (Math.random() < 0.65 ? 1 : -1) * (Math.PI - rand(0.25, 0.8));
    else if (dir !== 0) a = dir * rand(0.55, 1.45);
    else if (loft && Math.abs(err) < 0.03) a = rand(-0.3, 0.3);
    else a = clamp(-err * 14 + rand(-0.3, 0.3), -1.5, 1.5);
    const dist = out ? rand(18, 42) : ({ 0: rand(4, 10), 1: rand(14, 24), 2: rand(26, 38), 3: rand(40, 52) }[runs] || 0);
    return { runs, out, aerial: aerial || !!out, a, dist, edge, loft, defend };
  }
  function rayCircle(o, d, R) {
    const ox = o.x - CENTER.x, oz = o.z - CENTER.z, b = ox * d.x + oz * d.z, c = ox * ox + oz * oz - R * R;
    const t = -b + Math.sqrt(Math.max(0, b * b - c));
    return V(o.x + d.x * t, 0.04, o.z + d.z * t);
  }
  function nearestFielderIdx(p) {
    let best = 0, bd = Infinity;
    fielders.forEach((f, i) => { const d = f.userData.home.distanceTo(p); if (d < bd) { bd = d; best = i; } });
    return best;
  }
  function computeHit(h) {
    const d = S.del, o = computeOutcome(h);
    const P0 = ball.position.clone(); if (P0.z > -0.4) P0.set(d.xH, 0.7, ZH); P0.y = Math.max(0.3, P0.y);
    const dirV = dirVec(o.a);
    let P1, apex = 0, hop = 0.5, catcher = null, dur;
    if (o.out) {
      if (o.edge) { catcher = Math.random() < 0.5 ? -1 : 0; P1 = (catcher === -1 ? keeper.userData.home : fielders[0].userData.home).clone().setY(1.0); apex = 0.6; }
      else {
        const cand = P0.clone().addScaledVector(dirV, o.dist); cand.y = 0;
        catcher = nearestFielderIdx(cand);
        const home = fielders[catcher].userData.home, off = cand.sub(home); off.clampLength(0, 7);
        P1 = home.clone().add(off).setY(1.3); apex = rand(9, 18);
      }
    } else if (o.runs === 4) { P1 = rayCircle(P0, dirV, BOUNDARY + 1.5); hop = o.loft ? 2.5 : 0.7; }
    else if (o.runs === 6) { P1 = rayCircle(P0, dirV, rand(71, 82)); P1.y = 0.1; apex = rand(16, 26); }
    else { P1 = P0.clone().addScaledVector(dirV, o.dist).setY(0.04); if (o.aerial) apex = rand(5, 10); }
    const len = Math.hypot(P1.x - P0.x, P1.z - P0.z);
    if (o.out && o.edge) dur = 0.45;
    else dur = o.aerial ? 1.3 + apex / 14 + len / 90 : clamp(len / rand(24, 32) * 1.6, 0.5, 3.2);
    return { P0: P0.toArray(), P1: P1.toArray(), apex, hop, dur, o, catcher };
  }
  function applyHit(h) {
    const P0 = new THREE.Vector3().fromArray(h.P0), P1 = new THREE.Vector3().fromArray(h.P1), o = h.o;
    if (S.swingStart === null) { S.swung = true; S.swingStart = NOW - 0.12; }
    if (o.out) {
      const f = h.catcher === -1 ? keeper : fielders[h.catcher];
      S.chaser = { f, target: P1.clone().setY(0), speed: 7.5 };
    } else {
      const f = fielders[nearestFielderIdx(P1)], tgt = P1.clone().setY(0), off = tgt.clone().sub(CENTER);
      if (off.length() > BOUNDARY - 1.5) tgt.copy(CENTER).add(off.setLength(BOUNDARY - 1.5));
      S.chaser = { f, target: tgt, speed: 7 };
    }
    S.runners = !o.out && o.runs >= 1 && o.runs <= 3 ? { start: NOW + 0.25, runs: o.runs } : null;
    S.hit = { P0, P1, apex: h.apex, hop: h.hop, dur: h.dur, start: NOW, o, dirV: dirVec(o.a), flashed: false };
    S.phase = "hit"; ball.visible = true;
    S.hitEnd = NOW + Math.max(h.dur + 1.0, S.runners ? o.runs * 1.25 + 1.0 : 0, 2.2);
    pitchMarker.visible = false; sfx.hit();
  }
  function announce(o) {
    const st = S.inn.batters[S.inn.striker];
    if (o.out) { sfx.wicket(); S.celebrate = { t0: NOW }; showFlash("CAUGHT!", "#ef4444", `${st.name} ${st.runs} (${st.balls + 1})`); }
    else if (o.runs === 6) { sfx.cheer(); showFlash("SIX!", "#c084fc", `${st.name} goes big!`); }
    else if (o.runs === 4) { sfx.cheer(); showFlash("FOUR!", "#60a5fa", "Races to the rope"); }
    else if (o.runs === 0) showFlash(o.defend ? "DEFENDED" : "DOT BALL", "#f1f5f9");
    else showFlash(`${o.runs} RUN${o.runs > 1 ? "S" : ""}`, "#f8fafc");
  }
  function deadBall(res, text, color, sub) {
    S.result = res; S.phase = "dead"; S.deadEnd = NOW + 1.6; pitchMarker.visible = false;
    if (res.out) S.celebrate = { t0: NOW };
    showFlash(text, color, sub);
  }
  function applyDead(r) {
    if (r.ball) ball.position.fromArray(r.ball);
    if (r.swung && S.swingStart === null) { S.swung = true; S.swingStart = NOW - 0.15; }
    if (r.bowled) {
      sfx.wicket();
      S.stumpFx = { t0: NOW, vel: stumps.bails.map(() => V(rand(-1.5, 1.5), rand(2.5, 4), rand(2, 4))), tilt: stumps.parts.map(() => rand(0.4, 1.1)) };
    }
    deadBall(r.res, r.text, r.color, r.sub);
  }
  // The batter's computer decides each ball; in online play it tells the bowler's computer what happened.
  function resolve(r) {
    if (S.mode === "online" && bowlKind() === "remote") send({ t: "ball", r });
    if (r.kind === "hit") applyHit(r.hit); else applyDead(r);
  }
  function resolveDead(res, text, color, sub, bowled) {
    resolve({ kind: "dead", res, text, color, sub: sub || "", bowled: !!bowled, swung: S.swung, ball: ball.position.toArray() });
  }
  function swapStrike() { const inn = S.inn; [inn.striker, inn.non] = [inn.non, inn.striker]; }
  function finishBall(r) {
    const inn = S.inn, st = inn.batters[inn.striker];
    if (r.wide) { inn.runs += 1; inn.extras += 1; S.thisOver.push("Wd"); }
    else {
      inn.balls++; st.balls++;
      if (r.out) { inn.wkts++; st.out = r.out; S.thisOver.push("W"); }
      else {
        inn.runs += r.runs; st.runs += r.runs; S.thisOver.push(r.runs);

        if (r.runs === 6) inn.sixes++;

  // ================================================================ per-frame update
  function update(dt) {
    switch (S.phase) {
      case "aim":
        if (bowlKind() === "human") {
          const moved = keys.KeyA || keys.KeyD || keys.KeyW || keys.KeyS;
          if (keys.KeyA) S.aim.x += 1.6 * dt;
          if (keys.KeyD) S.aim.x -= 1.6 * dt;
          if (keys.KeyW) S.aim.L -= 5 * dt;
          if (keys.KeyS) S.aim.L += 5 * dt;
          S.aim.x = clamp(S.aim.x, -1.4, 1.4); S.aim.L = clamp(S.aim.L, 1.6, 10);
          aimMarker.position.set(S.aim.x, 0.026, -S.aim.L); aimMarker.visible = true;
          if (moved) updateStatus();
        } else if (bowlKind() === "cpu" && NOW >= S.cpuBowlAt) startDelivery(cpuSpec());
        break;
      case "runup": {
        const u = (NOW - S.runupStart) / RUNUP, U = bowler.userData;
        bowler.position.set(-0.35, 0, lerp(-26.5, -20.6, Math.min(u, 1)));
        if (u < 0.72) animRun(bowler, NOW * 13, 1);

          U.shR.rotation.set(-k * Math.PI * 1.75, 0, 0.05); U.elR.rotation.x = 0;
          U.shL.rotation.set(-Math.PI * 0.85 * Math.sin(Math.min(1, k * 1.3) * Math.PI), 0, -0.1); U.elL.rotation.x = 0.3;
          U.spine.rotation.x = lerp(0.25, -0.45, k); U.hips.position.y = HIP_Y - 0.04;

        break;
      }
      case "delivery": {
        const d = S.del, t = NOW - S.releaseAt;
        if (!S.frozen) ballPos(d, t, ball.position);
        if (!S.bounced && t >= d.t1) { S.bounced = true; sfx.bounce(); }
        if (batKind() === "remote") { // wait for the batter's computer to tell us what happened
          if (!S.frozen && ball.position.z >= 2.45) { S.frozen = true; ball.position.set(keeper.position.x, 0.6, 2.45); }
          const r = S.netResult;
          if (r && (r.kind === "hit" ? t >= d.T : (S.frozen || (r.bowled && ball.position.z >= 0) || t >= d.T + 0.6))) { S.netResult = null; resolve(r); }
          break;
        }
        if (S.cpuSwing && NOW >= S.cpuSwing.at) { const c = S.cpuSwing; S.cpuSwing = null; trySwing(c.dir, c.loft, false); }
        if (S.pendingHit && t >= S.pendingHit.at) { const h = S.pendingHit; S.pendingHit = null; resolve({ kind: "hit", hit: computeHit(h) }); break; }
        if (!S.crossed && ball.position.z >= 0) {
          S.crossed = true;
          if (!S.pendingHit && Math.abs(ball.position.x) < 0.2 && ball.position.y < 0.8) {
            const st = S.inn.batters[S.inn.striker];
            ball.position.z = 0; resolveDead({ out: "bowled" }, "BOWLED!", "#ef4444", `${st.name} ${st.runs} (${st.balls + 1})`, true); break;
          }
        }
        if (ball.position.z >= 2.45) {
          ball.position.set(keeper.position.x, 0.6, 2.45);
          if (d.wide) resolveDead({ wide: true }, "WIDE", "#cbd5e1", "+1 run");
          else if (S.swung && Math.abs(d.xH) < 0.5) resolveDead({ runs: 0 }, "BEATEN!", "#fbbf24");
          else resolveDead({ runs: 0 }, S.swung ? "DOT BALL" : "LEFT ALONE", "#f1f5f9");
        }
        break;
      }
      case "hit": {
        const H = S.hit, s = clamp((NOW - H.start) / H.dur, 0, 1);
        if (H.apex > 0 && H.o.aerial) {
          ball.position.set(lerp(H.P0.x, H.P1.x, s), lerp(H.P0.y, H.P1.y, s) + 4 * H.apex * s * (1 - s), lerp(H.P0.z, H.P1.z, s));

        }
        if (s >= 1 && !H.flashed) { H.flashed = true; announce(H.o); }
        if (S.runners) {
          const R = S.runners, kk = clamp((NOW - R.start) / 1.25, 0, R.runs), seg = Math.floor(kk), frac = kk - seg;
          const leg = seg % 2 === 0 ? frac : 1 - frac, moving = kk > 0 && kk < R.runs, goingUp = seg % 2 === 0;

          batsman.rotation.y = goingUp ? 0 : Math.PI; nonStriker.rotation.y = goingUp ? Math.PI : 0;
          if (moving) { animRun(batsman, NOW * 13, 1); animRun(nonStriker, NOW * 13 + 1, 1); } else { stand(batsman); stand(nonStriker); }
          batPivot.rotation.set(0.5, 0, 0);
        }
        if (NOW >= S.hitEnd) finishBall(H.o.out ? { out: "caught" } : { runs: H.o.runs });
        break;
      }
      case "dead":
        if (NOW >= S.deadEnd) finishBall(S.result);
        break;
    }

    // bowler follow-through + wicket celebration
    if (S.del && (S.phase === "delivery" || S.phase === "hit" || S.phase === "dead")) {
      const t = NOW - S.releaseAt, U = bowler.userData;
      if (S.celebrate) {

        U.shL.rotation.set(-2.8, 0, -0.35); U.shR.rotation.set(-2.8, 0, 0.35); U.hips.position.y = HIP_Y + Math.abs(Math.sin(c * 7)) * 0.12;
      } else if (t < 0.8) {
        bowler.position.z = -20.6 + easeOut(t / 0.8) * 2.4; animRun(bowler, NOW * 13, (1 - t / 0.8) * 0.8);

    const set = S.phase === "runup" || S.phase === "delivery";
    fielders.forEach((f) => {
      if (S.chaser && S.chaser.f === f) return;
      f.userData.ready = lerp(f.userData.ready, set ? 1 : 0, 1 - Math.exp(-dt * 5)); animReady(f, f.userData.ready);

    if (S.chaser) {
      const c = S.chaser, f = c.f, to = c.target.clone().sub(f.position).setY(0), dist = to.length();
      if (dist > 0.3) { f.position.addScaledVector(to.normalize(), Math.min(dist, c.speed * dt)); face(f, c.target.x, c.target.z); animRun(f, NOW * 13, 1); }

  }

  function batsmanPose(dt) {
    const U = batsman.userData;
    if (S.swingStart !== null) {
      const k = (NOW - S.swingStart) / 0.24;
      batAngle = k < 1 ? lerp(-1.7, 2.5, easeOut(k)) : k < 4 ? 2.5 : lerp(batAngle, -0.3, 1 - Math.exp(-dt * 5));
    } else {

    U.knL.rotation.set(-0.4, 0, 0); U.knR.rotation.set(-0.4, 0, 0);

    U.shL.rotation.set(0.85, 0, 0.35 + batAngle * 0.4); U.shR.rotation.set(0.85, 0, -0.05 + batAngle * 0.4);

  const DEF_POS = V(0, 3.5, -29.5), DEF_LOOK = V(0, 0.9, -4), camLook = DEF_LOOK.clone();
  function updateCamera(dt) {
    let pos, look, speed = 4;
    if (S.phase === "hit" && S.hit) {
      const b = ball.position, H = S.hit;
      pos = V(lerp(0, b.x, 0.5), 0, lerp(ZH, b.z, 0.5)).addScaledVector(H.dirV, -24);
      pos.y = 20 + Math.min(18, Math.hypot(H.P1.x - H.P0.x, H.P1.z - H.P0.z) * 0.15);

  // ================================================================ online (talks to game_server.py)
  const API = { base: "", token: store.get("cl3d_token") };
  function defaultServer() {
    if (/^https?:$/.test(location.protocol)) return location.origin;           // the game server is hosting this page
    if (SERVER_DEFAULT && !SERVER_DEFAULT.startsWith("__")) return SERVER_DEFAULT; // address passed in by the Streamlit app
    return store.get("cl3d_server") || "";
  }
  function normalizeServer(s) {
    s = (s || "").trim().replace(/\/+$/, "");
    if (s && !/^https?:\/\//i.test(s)) s = "http://" + s;
    return s;
  }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function api(path, body, timeoutMs) {
    const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), timeoutMs || 10000);
    let res;
    try {
      res = await fetch(API.base + path, {
        method: body ? "POST" : "GET", signal: ctrl.signal,
        headers: Object.assign({ "Content-Type": "application/json" }, API.token ? { Authorization: "Bearer " + API.token } : {}),
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (e) {
      const err = new Error(unreachableText()); err.network = true; throw err;
    } finally { clearTimeout(timer); }
    let data = {};
    try { data = await res.json(); } catch (e) { /* empty body */ }
    if (!res.ok) { const err = new Error(data.error || `Server error (${res.status})`); err.status = res.status; throw err; }
    return data;
  }
  function unreachableText() {
    let t = `Can't reach the game server at <b>${esc(API.base || "(no address)")}</b>. Check that it's running and that you're on the same network.`;
    if (window.isSecureContext && /^http:/.test(API.base) && !/localhost|127\.0\.0\.1/.test(API.base)) {
      t += ` Your browser blocks it from this secure (https) page, so open <b>${esc(API.base)}</b> directly in a new tab and play from there.`;
    }
    return t;
  }

  async function goOnline() {
    screen("scrAuth");
    $("auServer").value = defaultServer();
    formMsg("auMsg", "");
    API.base = normalizeServer($("auServer").value);
    if (API.token && API.base) {
      formMsg("auMsg", "Signing you in…", true);
      try { const r = await api("/api/me"); S.me = r.profile; formMsg("auMsg", ""); openLobby(); }
      catch (e) { if (e.status === 401) { API.token = null; store.set("cl3d_token", null); formMsg("auMsg", ""); } else formMsg("auMsg", e.message); }
    }
  }
  let authTab = "in";
  function setAuthTab(t) {
    authTab = t;
    document.querySelectorAll("#authTabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
    $("auGo").textContent = t === "up" ? "Create account" : "Sign in";
    $("auUser").placeholder = t === "up" ? "Pick a username (3–16 letters, numbers or _)" : "Username";
    $("auPass").placeholder = t === "up" ? "Pick a password (6+ characters)" : "Password";
    $("auPass").autocomplete = t === "up" ? "new-password" : "current-password";
    formMsg("auMsg", "");
  }
  async function submitAuth() {
    const username = $("auUser").value.trim(), password = $("auPass").value;
    API.base = normalizeServer($("auServer").value);
    if (!API.base) return formMsg("auMsg", "Enter the game server address first (ask whoever is running it).");
    if (!username || !password) return formMsg("auMsg", "Enter a username and password.");
    if (authTab === "up" && !/^[A-Za-z0-9_]{3,16}$/.test(username)) return formMsg("auMsg", "Usernames are 3–16 letters, numbers or _.");
    if (authTab === "up" && password.length < 6) return formMsg("auMsg", "Passwords need at least 6 characters.");
    $("auGo").disabled = true;
    try {
      API.token = null;
      const r = await api(authTab === "up" ? "/api/signup" : "/api/login", { username, password });
      API.token = r.token; S.me = r.profile;
      store.set("cl3d_token", r.token); store.set("cl3d_server", API.base);

  function openLobby() {

    renderPicker($("pickOnline"), me.team, (k) => { me.team = k; api("/api/team", { team: k }).catch(() => {}); openLobby(); });
    renderChips($("oversChipsOnline"), [1, 2, 3, 5, 10], S.setup.overs, (v) => { S.setup.overs = v; openLobby(); }, null, true);
    renderChips($("wktChipsOnline"), [1, 2, 3, 5, 10], S.setup.wkts, (v) => { S.setup.wkts = v; openLobby(); });

  async function createRoom() {
    formMsg("lbMsg", ""); $("createRoom").disabled = true;

    catch (e) { formMsg("lbMsg", e.message); }

  }
  async function joinRoom() {
    const code = $("joinCode").value.toUpperCase().trim();

    formMsg("lbMsg", "");

  }
  function enterRoom(r, isHost) {
    const net = { code: r.code, isHost, peer: null, room: null, inMatch: false, since: r.since, chain: Promise.resolve(), fails: 0 };
    S.net = net;
    $("roomCode").textContent = r.code; formMsg("roomMsg", "");
    applyRoom(r.room); screen("scrRoom");
    pollLoop(net);
  }
  async function pollLoop(net) {
    while (S.net === net) {
      try {
        const r = await api(`/api/poll?code=${net.code}&since=${net.since}`, null, 30000);
        net.fails = 0;
        for (const ev of r.events) {
          if (S.net !== net) return;
          net.since = Math.max(net.since, ev.id);
          if (ev.payload && ev.payload.t === "room") applyRoom(ev.payload); else if (ev.payload) onNet(ev.payload);
        }
      } catch (e) {
        if (S.net !== net) return;
        if (e.status === 404 || e.status === 403) return roomClosed(net.inMatch ? "Your opponent left the match." : "This room has closed.");
        if (++net.fails >= 5) return roomClosed("Lost connection to the game server.");
        await sleep(1000);
      }
    }
  }
  function send(payload) {
    const net = S.net; if (!net) return;
    net.chain = net.chain.then(() => api("/api/send", { code: net.code, payload })).catch(() => {});
  }
  function applyRoom(room) {
    const net = S.net; if (!net) return;
    net.room = room;
    const hadPeer = !!net.peer;
    net.peer = room.players.find((p) => p.id !== S.me.id) || null;
    if (!net.isHost && !room.players.some((p) => p.host)) return roomClosed("The host closed the room.");
    if (hadPeer && !net.peer && net.inMatch) return opponentLeft();
    renderRoom();
  }
  function renderRoom() {
    const net = S.net; if (!net || !net.room) return;
    const host = net.room.players.find((p) => p.host), guest = net.room.players.find((p) => !p.host);
    const side = (m) => m ? `${badgeHTML(m.team, "lg")}<b>${esc(m.name)}</b><small>${IPL[m.team] ? IPL[m.team].name : ""}</small>`
      : `<div class="wait">Waiting for a player…</div>`;
    $("roomHost").innerHTML = side(host); $("roomGuest").innerHTML = side(guest);
    const mine = net.room.players.find((p) => p.id === S.me.id);
    renderPicker($("pickRoom"), mine ? mine.team : S.me.team, (k) => {
      S.me.team = k; api("/api/room/team", { code: net.code, team: k }).catch((e) => formMsg("roomMsg", e.message));
    }, net.peer ? net.peer.team : null);

    $("roomStart").classList.toggle("hidden", !net.isHost);
    $("roomStart").disabled = !net.peer || sameTeam;
    const o = net.room.overs, w = net.room.wkts;
    $("roomInfo").textContent = `${o} over${o === 1 ? "" : "s"} · ${w} wicket${w === 1 ? "" : "s"}` +

  }
  function roomClosed(text) {
    const wasInMatch = S.net && S.net.inMatch;

  function backToLobby() { S.token++; S.phase = "menu"; S.inn = null; S.mode = null; resetField(); $("hud").classList.add("hidden"); hideMsg(); openLobby(); }
  function leaveRoom() {

  function opponentLeft() {

  function hostStart() {

    const mine = net.room.players.find((p) => p.id === S.me.id);
    const d = { t: "start", cfg: { overs: net.room.overs, wkts: net.room.wkts },
      teams: [{ id: S.me.id, name: S.me.username, key: mine ? mine.team : S.me.team }, { id: net.peer.id, name: net.peer.name, key: net.peer.team }],
      toss: Math.random() < 0.5 ? 0 : 1, bat: Math.random() < 0.5 };
    send(d); startOnline(d);
  }
  function startOnline(d) {
    S.mode = "online"; S.cfg = { overs: d.cfg.overs, wkts: d.cfg.wkts, diff: "medium" };
    S.teams = d.teams.map((t) => ({ key: t.key, name: t.name, kind: t.id === S.me.id ? "human" : "remote" }));
    resetMatchState(); S.net.inMatch = true;
    const tok = S.token, w = d.toss, batFirst = d.bat ? w : 1 - w;
    showMsg("🪙 Toss", `<p>${badgeHTML(S.teams[w].key, "sm")} <b>${esc(S.teams[w].name)}</b> won the toss and chose to ` +
      `<b>${batFirst === w ? "bat" : "bowl"}</b>.</p><p class="muted small">Starting…</p>`, []);
    setTimeout(() => { if (tok !== S.token) return; hideMsg(); S.innings = [newInnings(batFirst, 1 - batFirst), null]; startInnings(); }, 3000);
  }
  function onNet(p) {
    switch (p.t) {
      case "start": if (!S.net.isHost) startOnline(p); break;
      case "bowl":
        if (S.phase === "aim" && bowlKind() === "remote") startDelivery(p.s); else S.pendingBowl = p.s;
        break;
      case "ball": S.netResult = p.r; break;
      case "leave": if (S.net.inMatch) opponentLeft(); break;
    }
  }
  window.addEventListener("pagehide", () => {
    if (S.net && API.token && navigator.sendBeacon) navigator.sendBeacon(API.base + "/api/room/leave", JSON.stringify({ code: S.net.code, token: API.token }));
  });

  // ================================================================ menus wiring
  function renderHome() { $("homeUser").innerHTML = S.me ? `Signed in as <b>${esc(S.me.username)}</b>` : ""; }
  function renderSetup() {
    const s = S.setup;
    renderPicker($("pick1"), s.team, (k) => { s.team = k; renderSetup(); });
    renderChips($("oversChips"), [1, 2, 3, 5, 10, 20], s.overs, (v) => { s.overs = v; renderSetup(); }, null, true);
    renderChips($("wktChips"), [1, 2, 3, 5, 10], s.wkts, (v) => { s.wkts = v; renderSetup(); });
    renderChips($("diffChips"), ["easy", "medium", "hard"], s.diff, (v) => { s.diff = v; renderSetup(); }, (v) => v[0].toUpperCase() + v.slice(1));
  }
  document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
    ac();
    if (b.dataset.go === "online") goOnline(); else { renderSetup(); screen("scrSetup"); }
  }));
  document.querySelectorAll("[data-back]").forEach((b) => b.addEventListener("click", () => { renderHome(); screen(b.dataset.back); }));
  $("setupStart").onclick = () => { ac(); startOffline(); };
  document.querySelectorAll("#authTabs button").forEach((b) => b.addEventListener("click", () => setAuthTab(b.dataset.tab)));
  $("auGo").onclick = submitAuth;
  $("auPass").addEventListener("keydown", (e) => { if (e.key === "Enter") submitAuth(); });
  $("signOut").onclick = () => {
    api("/api/logout", {}).catch(() => {});
    API.token = null; store.set("cl3d_token", null); S.me = null; renderHome(); screen("scrHome");
  };
  $("createRoom").onclick = createRoom;
  $("joinBtn").onclick = joinRoom;
  $("joinCode").addEventListener("keydown", (e) => { if (e.key === "Enter") joinRoom(); });
  $("roomLeave").onclick = leaveRoom;
  $("roomStart").onclick = hostStart;
  $("copyCode").onclick = () => {
    try { navigator.clipboard.writeText(S.net.code); $("copyCode").textContent = "Copied!"; } catch (e) { /* clipboard blocked */ }
    setTimeout(() => { $("copyCode").textContent = "Copy code"; }, 1500);
  };
  $("menuBtn").onclick = () => {
    const online = S.mode === "online";
    showMsg("Leave this match?", online ? "<p>Your opponent will be told you left.</p>" : "<p>This match's progress will be lost.</p>",
      [{ label: "Keep playing", fn: () => {} }, { label: "Leave match", fn: () => (online ? leaveRoom() : toMenu()) }]);
  };

  // ================================================================ input
  window.addEventListener("keydown", (e) => {
    const typing = e.target && e.target.tagName === "INPUT";
    if (!typing && ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
      e.preventDefault();
      if (document.activeElement && document.activeElement.tagName === "BUTTON") document.activeElement.blur();
    }
    keys[e.code] = true;
    if (e.repeat || typing) return;
    if (!S.inn || !["aim", "runup", "delivery"].includes(S.phase)) return;
    if (e.code === "Space") humanSwing();
    if (bowlKind() === "human" && S.phase === "aim") {
      if (e.code === "KeyQ") { S.aim.type = S.aim.type === "fast" ? "spin" : "fast"; updateStatus(); }
      if (e.code === "KeyF") bowlHuman();
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });
  renderer.domElement.addEventListener("mousedown", () => { ac(); humanSwing(); });
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ================================================================ loop
  resetField(); renderHome();
  let last = performance.now() / 1000;
  function loop() {
    requestAnimationFrame(loop);
    NOW = performance.now() / 1000;
    const dt = Math.min(0.05, NOW - last); last = NOW;
    update(dt); updateCamera(dt);
    renderer.render(scene, camera);
  }
  loop();
})();
</script>
</body>
</html>
