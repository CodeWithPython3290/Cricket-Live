<!DOCTYPE html>
<!--
  Cricket League 3D launcher + online bridge (a Streamlit custom component).
  - The button opens the game in a new about:blank tab.
  - The game calls window.opener.__cricketBridge.request(op, data) for online play; each request is
    sent to Python (streamlit_app.py -> multiplayer.py) and the reply comes back with the next render.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap');
  body { margin: 0; font-family: Inter, system-ui, sans-serif; }
  button { width: 100%; height: 44px; border: 0; border-radius: 10px; cursor: pointer; font: 700 14px Inter, sans-serif;
    color: #fff; letter-spacing: .01em; background: linear-gradient(135deg, #059669, #10b981);
    box-shadow: 0 6px 18px rgba(16,185,129,.28); transition: transform .12s, box-shadow .12s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(16,185,129,.35); }
  #msg { font-size: 12px; color: #ef4444; margin-top: 4px; min-height: 14px; }
</style>
</head>
<body>
<button id="play">▶&nbsp; Play in new tab</button>
<div id="msg"></div>
<script>
(function () {
  const post = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");
  const waiting = {};
  let seq = 0, queue = [];

  // Every pending request is resent until Python answers it, so none are lost if Streamlit is mid-rerun.
  function flush() {
    post("streamlit:setComponentValue", { value: { seq: ++seq, reqs: queue.map(({ id, op, data }) => ({ id, op, data })) }, dataType: "json" });
  }
  function finish(id, result) {
    const w = waiting[id]; if (!w) return;
    clearTimeout(w.timer); delete waiting[id];
    queue = queue.filter((q) => q.id !== id);
    w.resolve(result);
  }
  window.__cricketBridge = {
    request(op, data) {
      return new Promise((resolve) => {
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const timer = setTimeout(() => finish(id, { error: "The app didn't answer in time. Keep the Cricket Live Hub tab open and try again.", status: 0 }), 20000);
        waiting[id] = { resolve, timer };
        queue.push({ id, op, data: JSON.parse(JSON.stringify(data || {})) });
        flush();
      });
    },
  };
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "streamlit:render") return;
    const res = (d.args && d.args.responses) || {};
    Object.keys(res).forEach((id) => finish(id, res[id]));
  });

  document.getElementById("play").onclick = async () => {
    const msg = document.getElementById("msg");
    msg.textContent = "";
    const w = window.open("about:blank", "_blank");
    if (!w) { msg.textContent = "Your browser blocked the new tab - allow this site to open tabs and try again."; return; }
    try {
      const html = await (await fetch("cricket_league_3d.html", { cache: "no-store" })).text();
      w.document.open(); w.document.write(html); w.document.close();
    } catch (err) {
      w.close(); msg.textContent = "Couldn't load the game. Try again.";
    }
  };

  post("streamlit:componentReady", { apiVersion: 1 });
  post("streamlit:setFrameHeight", { height: 66 });
})();
</script>
</body>
</html>
