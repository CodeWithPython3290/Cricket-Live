<!DOCTYPE html>
<!--
  Cricket League 3D launcher + online bridge (a Streamlit custom component).
  - The button opens the game in a new about:blank tab.
  - The game calls window.opener.__cricketBridge.request(op, data) for online play; each request is
    sent to Python (streamlit_app.py -> multiplayer.py) and the reply comes back with the next render.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; font-family: Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button { display: block; width: 100%; height: 44px; border: 0; border-radius: 10px; cursor: pointer; font: 700 14px Inter, sans-serif;
    color: #065f46; letter-spacing: .01em; background: #fff;
    transition: background .12s; }
  button:hover { background: #ecfdf5; }
  #msg { font-size: 12px; color: #fecaca; margin-top: 6px; line-height: 1.3; }
  #msg:empty { display: none; }
  @media (max-width: 170px) { .long { display: none; } } /* narrow column: just "▶ Play" so it stays on one line */
</style>
</head>
<body>
<button id="play">▶&nbsp; Play<span class="long"> in new tab</span></button>
<div id="msg"></div>
<script>
(function () {
  const post = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");
  const waiting = {};
  let seq = 0, queue = [];

  // Every pending request is resent until Python answers it, so none are lost if Streamlit is mid-rerun.
  function flush() {
    post("streamlit:setComponentValue", { value: { seq: ++seq, reqs: queue.map(({ id, op, data }) => ({ id, op, data })) }, dataType: "json" });
  }
  function finish(id, result) {
    const w = waiting[id]; if (!w) return;
    clearTimeout(w.timer); delete waiting[id];
    queue = queue.filter((q) => q.id !== id);
    w.resolve(result);
  }
  window.__cricketBridge = {
    request(op, data) {
      return new Promise((resolve) => {
        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        const timer = setTimeout(() => finish(id, { error: "The app didn't answer in time. Keep the Cricket Live Hub tab open and try again.", status: 0 }), 20000);
        waiting[id] = { resolve, timer };
        queue.push({ id, op, data: JSON.parse(JSON.stringify(data || {})) });
        flush();
      });
    },
  };
  window.addEventListener("message", (e) => {
    const d = e.data;
    if (!d || d.type !== "streamlit:render") return;
    const res = (d.args && d.args.responses) || {};
    Object.keys(res).forEach((id) => finish(id, res[id]));
  });

  // The frame is exactly the button's height; it only grows when there's an error to show.
  function showError(text) {
    document.getElementById("msg").textContent = text;
    post("streamlit:setFrameHeight", { height: text ? 66 : 44 });
  }
  document.getElementById("play").onclick = async () => {
    showError("");
    const w = window.open("about:blank", "_blank");
    if (!w) { showError("Your browser blocked the new tab. Allow this site to open tabs and try again."); return; }
    try {
      // The game and its 3D engine both come from this app's own folder, then the engine is pasted into the page,
      // so the game starts without an internet connection.
      const [html, engine] = await Promise.all([
        fetch("cricket_league_3d.html", { cache: "no-store" }).then((r) => r.text()),
        fetch("three.min.js").then((r) => r.text()),
      ]);
      // (written as <\/script> so this page's own <script> block isn't ended early)
      const page = html.replace('<script src="three.min.js"><\/script>', () => "<script>" + engine + "<\/script>");
      w.document.open(); w.document.write(page); w.document.close();
    } catch (err) {
      w.close(); showError("Couldn't load the game. Try again.");
    }
  };

  post("streamlit:componentReady", { apiVersion: 1 });
  showError("");
})();
</script>
</body>
</html>
